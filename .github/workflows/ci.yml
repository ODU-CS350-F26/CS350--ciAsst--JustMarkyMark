---
name: CI - build and test
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: adopt
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew build test
      - name: Deploy reports using an SSH agent
      run: |
        eval $(ssh-agent -s -t 600)        
        ssh-add <(echo "${{ secrets.REPORTS_SSH_KEY }}")
        git config --global user.email "mfous001@odu.edu"
        git config --global user.name "JustMarkyMark"
        ./gradlew deployReports
