plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '6.0.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.7.0'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

task copyHTML(type: Copy){
	from 'src/main/html/'
	into 'build/reports/'
}

task copyDocs(type: Copy, dependsOn: javadoc){
	from 'build/docs/'
	into 'build/reports/'
}

task reports (dependsOn: [build, copyHTML, copyDocs])

gitPublish{
	repoUri = 'https://github.com/ODU-CS350-F26/CS350--ciAsst--JustMarkyMark.git'
	branch = 'gh-pages'

	contents{
	from 'build/reports'
	}

	sign = false
	def token = System.getenv("GITHUB_TOKEN")

	if (token) {
		username = System.getenv("GITHUB_ACTOR") ?: "git"
		password = token
	}
}

gitPublishCopy.dependsOn reports

task deployReports(dependsOn: gitPublishPush)


